      /* [VARS:ROOT:START] */

      /* [COMPONENT:layout:START] */

      /* INITIAL */

      button.accent { background-color: var(--button-accent-bg); color: var(--button-accent-color); border-color: transparent; }

      button.retro {

        background-color: var(--retro-button-bg); color: var(--retro-button-color);
        box-shadow: var(--retro-shadow-offset) var(--retro-shadow-offset) 0 0 var(--retro-shadow-color);
      }

      button.retro:active { transform: translate(var(--retro-shadow-offset), var(--retro-shadow-offset)); box-shadow: none; background-color: var(--retro-button-active-bg); }

      button.retro.accent { background-color: var(--button-accent-bg); color: var(--button-accent-color); border-color: var(--retro-button-border-color); }

      button.modern {

      button.futuristic.accent { --futuristic-button-border-color: var(--button-accent-bg); --futuristic-button-hover-glow: var(--button-accent-bg); color: var(--button-accent-bg); }
      /* [COMPONENT:button:END] */

      /* [COMPONENT:input:START] */
      /* [COMPONENT:form:START] */
      label { display: block; margin-bottom: 0.375rem; font-size: 0.875rem; font-weight: 500; }
      
      /* INITIAL INPUT */
        input, textarea {
          font: inherit;
        }
        input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea {
          width: 100%;
          padding: var(--input-padding-y) var(--input-padding-x);

        input.retro:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select.retro, textarea.retro {

      /* Checkboxes */
      input[type="checkbox"] { appearance: none; width: var(--checkbox-size); height: var(--checkbox-size); border: 1px solid var(--checkbox-border); border-radius: var(--checkbox-radius); background: var(--checkbox-bg); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }

      /* INITIAL */
      .card { 
          padding: var(--card-padding); 
          border-radius: var(--card-border-radius); 
          background-color: var(--card-bg); 
          color: var(--card-color);
          border: var(--card-border-width) solid var(--card-border-color);
          box-shadow: var(--card-shadow);
      }
      /* RETRO */
      .card.retro {
          border-radius: 0;
          border: var(--retro-border-width) solid var(--retro-card-border-color);
          background-color: var(--retro-card-bg); color: var(--retro-card-color);
          box-shadow: var(--retro-shadow-offset) var(--retro-shadow-offset) 0 var(--retro-shadow-color);
      }
      /* MODERN */
      .card.modern {
          border-radius: var(--modern-radius);
          background-color: var(--modern-card-bg); color: var(--modern-card-color);
          border: 1px solid var(--modern-card-border-color);
          box-shadow: var(--shadow-sm);
      }
      /* FUTURISTIC */
      .card.futuristic {
          border-radius: 4px;
          clip-path: var(--futuristic-clip-path);
          background-color: var(--futuristic-card-bg); color: var(--futuristic-card-color);
          border: 1px solid var(--futuristic-card-border-color);
          backdrop-filter: blur(10px);
          box-shadow: 0 0 20px -10px var(--futuristic-glow);
          position: relative;
          overflow: hidden;
      }
      .card.futuristic::after {
          content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
          background: linear-gradient(90deg, transparent, var(--futuristic-glow), transparent);
          animation: scanline 3s infinite linear;
      }
      @keyframes scanline { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
      /* [COMPONENT:card:END] */

      /* [COMPONENT:badge:START] */
      .badge { display: inline-flex; align-items: center; justify-content: center; padding: var(--badge-padding-y) var(--badge-padding-x); border-radius: var(--badge-border-radius); font-size: var(--badge-font-size); border: 1px solid transparent; font-weight: 600; line-height: 1; white-space: nowrap; }
      .badge.primary { background: var(--badge-primary-bg); color: var(--badge-primary-color); }
      .badge.secondary { background: var(--badge-secondary-bg); color: var(--badge-secondary-color); }
      .badge.accent { background: var(--badge-accent-bg); color: var(--badge-accent-color); }
      
      /* Retro Badge */
      .badge.retro { border-radius: 0; border: 1px solid currentColor; background: var(--retro-badge-bg); box-shadow: 2px 2px 0 var(--retro-shadow-color); }
      .badge.retro.primary { color: var(--badge-primary-bg); border-color: var(--badge-primary-bg); }
      .badge.retro.secondary { color: var(--badge-secondary-bg); border-color: var(--badge-secondary-bg); }
      .badge.retro.accent { color: var(--badge-accent-bg); border-color: var(--badge-accent-bg); }
      
      /* Modern Badge */
      .badge.modern { border-radius: 99px; background: var(--modern-badge-bg); border: 1px solid transparent; }
      .badge.modern.primary { background: color-mix(in srgb, var(--badge-primary-bg) 15%, transparent); color: var(--badge-primary-bg); border-color: color-mix(in srgb, var(--badge-primary-bg) 20%, transparent); }
      .badge.modern.secondary { background: color-mix(in srgb, var(--badge-secondary-bg) 15%, transparent); color: var(--badge-secondary-bg); border-color: color-mix(in srgb, var(--badge-secondary-bg) 20%, transparent); }
      .badge.modern.accent { background: color-mix(in srgb, var(--badge-accent-bg) 15%, transparent); color: var(--badge-accent-bg); border-color: color-mix(in srgb, var(--badge-accent-bg) 20%, transparent); }
      
      /* Futuristic Badge */
      .badge.futuristic { border-radius: 0; border: 1px solid currentColor; background: var(--futuristic-badge-bg); text-shadow: 0 0 5px currentColor; box-shadow: 0 0 5px currentColor; letter-spacing: 0.1em; }
      .badge.futuristic.primary { color: var(--badge-primary-bg); }
      .badge.futuristic.secondary { color: var(--badge-secondary-bg); }
      .badge.futuristic.accent { color: var(--badge-accent-bg); }
      /* [COMPONENT:badge:END] */

      /* [COMPONENT:alert:START] */
      .alert { padding: var(--alert-padding-y) var(--alert-padding-x); border-radius: var(--alert-border-radius); display: flex; align-items: center; border: var(--alert-border-width) solid transparent; width: 100%; margin-bottom: 0.5rem; }
      .alert[data-status="info"], .alert.info { background: var(--alert-info-bg); color: var(--alert-info-color); border-color: var(--alert-info-border); }
      .alert[data-status="success"], .alert.success { background: var(--alert-success-bg); color: var(--alert-success-color); border-color: var(--alert-success-border); }
      .alert[data-status="warning"], .alert.warning { background: var(--alert-warning-bg); color: var(--alert-warning-color); border-color: var(--alert-warning-border); }
      .alert[data-status="danger"], .alert[data-status="error"], .alert.danger, .alert.error { background: var(--alert-error-bg); color: var(--alert-error-color); border-color: var(--alert-error-border); }
      
      .alert.retro { border-radius: 0; border: var(--retro-border-width) solid currentColor; background: var(--retro-alert-bg); box-shadow: 4px 4px 0 var(--retro-shadow-color); }
      .alert.modern { border-radius: var(--border-radius-md); background: var(--modern-alert-bg); border-left: 4px solid currentColor; box-shadow: var(--shadow-sm); }
      .alert.modern[data-status="info"] { color: var(--color-secondary); }
      .alert.modern[data-status="success"] { color: var(--color-success); }
      .alert.modern[data-status="warning"] { color: var(--color-warning); }
      .alert.modern[data-status="danger"] { color: var(--color-danger); }

      .alert.futuristic { border-radius: 0; clip-path: var(--futuristic-clip-path); border: 1px solid currentColor; background: var(--futuristic-alert-bg); backdrop-filter: blur(4px); position: relative; }
      .alert.futuristic::before { content: ''; position: absolute; left: 0; top: 0; width: 4px; height: 100%; background: currentColor; box-shadow: 0 0 10px currentColor; }
      .alert.futuristic[data-status="info"] { color: var(--color-secondary); }
      .alert.futuristic[data-status="success"] { color: var(--color-success); }
      .alert.futuristic[data-status="warning"] { color: var(--color-warning); }
      .alert.futuristic[data-status="danger"] { color: var(--color-danger); }
      /* [COMPONENT:alert:END] */

      /* [COMPONENT:table:START] */
      table { width: 100%; border-collapse: collapse; border: 1px solid var(--table-border-color); }
      thead { background: var(--table-header-bg); }
      tbody tr { background: var(--table-row-bg); }
      tbody tr:hover { background: var(--table-row-hover-bg); }
      th, td { padding: var(--table-cell-padding); text-align: left; border: 1px solid var(--table-border-color); }
      th { background: var(--table-header-bg); color: var(--table-header-color); font-weight: 600; }
      
      table.retro th { background: var(--retro-table-header-bg); color: var(--retro-table-header-color); border: var(--retro-border-width) solid var(--retro-table-border-color); }
      table.retro td { border: var(--retro-border-width) solid var(--retro-table-border-color); }
      
      table.modern th { background: transparent; border-bottom: 2px solid var(--border-default); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; color: var(--text-muted); }
      table.modern tr:nth-child(even) { background: var(--modern-table-stripe-bg); }
      
      table.futuristic { border: 1px solid var(--color-primary); }
      table.futuristic th { background: color-mix(in srgb, var(--color-primary) 10%, transparent); color: var(--color-primary); text-shadow: 0 0 5px var(--futuristic-table-glow); border-bottom: 1px solid var(--color-primary); text-transform: uppercase; letter-spacing: 0.1em; }
      table.futuristic td { color: var(--text-default); border-bottom: 1px solid color-mix(in srgb, var(--color-primary) 30%, transparent); }
      /* [COMPONENT:table:END] */

      /* [COMPONENT:tabs:START] */
      .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border-default); }
      .tab { padding: var(--tab-padding-y) var(--tab-padding-x); font-size: var(--tab-font-size); background: transparent; border: none; cursor: pointer; color: var(--tab-inactive-color); transition: all 0.2s; border-bottom: 2px solid transparent; }
      .tab[aria-selected="true"], .tab.active { color: var(--tab-active-color); border-bottom-color: var(--tab-active-border-color); font-weight: 500; }
      .tab:hover:not([aria-selected="true"]) { background: var(--bg-subtle); }
      
      .tabs.retro { gap: 4px; border-bottom: none; }
      .tabs.retro .tab { border: var(--retro-border-width) solid transparent; border-bottom: none; background: var(--bg-default); }
      .tabs.retro .tab[aria-selected="true"], .tabs.retro .tab.active { background: var(--retro-tab-active-bg); border-color: currentColor; color: var(--bg-default); }
      
      .tabs.modern { background: var(--bg-subtle); padding: 4px; border-radius: 99px; gap: 0; border-bottom: none; }
      .tabs.modern .tab { border-radius: 99px; border: none; padding: 8px 16px; }
      .tabs.modern .tab[aria-selected="true"], .tabs.modern .tab.active { background: white; box-shadow: var(--shadow-sm); color: var(--modern-tab-active-color); font-weight: 600; }
      
      .tabs.futuristic { background: var(--futuristic-tab-bg); padding: 4px; border: 1px solid var(--color-primary); border-bottom: none; }
      .tabs.futuristic .tab { color: var(--text-muted); }
      .tabs.futuristic .tab[aria-selected="true"], .tabs.futuristic .tab.active { background: color-mix(in srgb, var(--color-primary) 20%, transparent); box-shadow: 0 0 10px var(--color-primary); color: var(--color-primary); text-shadow: 0 0 5px currentColor; }
      /* [COMPONENT:tabs:END] */

      /* [COMPONENT:pagination:START] */
      .pagination { display: flex; gap: 0.25rem; list-style: none; padding: 0; }
      .pagination-item { 
          width: var(--pagination-item-size); height: var(--pagination-item-size); 
          display: flex; align-items: center; justify-content: center; 
          border-radius: var(--pagination-item-border-radius); 
          color: var(--pagination-item-color); cursor: pointer; 
          transition: all 0.2s; 
      }
      .pagination-item:hover { background-color: var(--pagination-item-hover-bg); }
      .pagination-item.active { background-color: var(--pagination-item-active-bg); color: var(--pagination-item-active-color); }

      .pagination.retro .pagination-item { border-radius: 0; border: var(--retro-border-width) solid transparent; }
      .pagination.retro .pagination-item.active { background-color: var(--retro-pagination-active-bg); color: var(--retro-pagination-bg); border-color: currentColor; box-shadow: 2px 2px 0 var(--retro-shadow-color); }
      
      .pagination.modern .pagination-item.active { background-color: transparent; color: var(--modern-pagination-active-color); font-weight: bold; border-bottom: 2px solid currentColor; border-radius: 0; }
      
      .pagination.futuristic .pagination-item { border: 1px solid transparent; }
      .pagination.futuristic .pagination-item.active { border-color: var(--color-primary); box-shadow: 0 0 10px var(--futuristic-pagination-glow); text-shadow: 0 0 5px currentColor; color: var(--color-primary); background: transparent; }
      /* [COMPONENT:pagination:END] */

      /* [COMPONENT:breadcrumb:START] */
      .breadcrumb { display: flex; gap: 0.5rem; color: var(--text-muted); font-size: 0.875rem; }
      .breadcrumb-item { display: flex; items-center; gap: 0.5rem; }
      .breadcrumb-item::after { content: '/'; color: var(--breadcrumb-separator-color); }
      .breadcrumb-item:last-child::after { content: none; }
      .breadcrumb-item.active { color: var(--breadcrumb-active-color); font-weight: 500; }
      
      .breadcrumb.retro .breadcrumb-item::after { content: var(--retro-breadcrumb-separator); }
      
      .breadcrumb.modern .breadcrumb-item a { color: var(--modern-breadcrumb-color); text-decoration: underline; text-decoration-color: transparent; transition: all 0.2s; }
      .breadcrumb.modern .breadcrumb-item a:hover { text-decoration-color: currentColor; }
      
      .breadcrumb.futuristic .breadcrumb-item.active { color: var(--color-primary); text-shadow: 0 0 5px var(--futuristic-breadcrumb-glow); }
      .breadcrumb.futuristic .breadcrumb-item::after { content: '>'; color: var(--color-primary); }
      /* [COMPONENT:breadcrumb:END] */

      /* [COMPONENT:avatar:START] */
      .avatar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: var(--avatar-size);
        height: var(--avatar-size);
        border-radius: var(--avatar-border-radius);
        background: var(--avatar-bg);
        color: var(--avatar-color);
        font-weight: 600;
        font-size: calc(var(--avatar-size) / 2.5);
        border: var(--avatar-border-width) solid var(--avatar-border-color);
        overflow: hidden;
        position: relative;
      }
      .avatar img { width: 100%; height: 100%; object-fit: cover; }
      
      .avatar.retro {
        border-radius: 0;
        border: var(--retro-border-width) solid var(--retro-avatar-border-color);
        box-shadow: var(--retro-shadow-offset) var(--retro-shadow-offset) 0 var(--retro-shadow-color);
      }
      
      .avatar.modern {
        box-shadow: var(--shadow-sm);
        border: 2px solid var(--bg-default);
        outline: 1px solid var(--border-default);
      }
      
      .avatar.futuristic {
        border-radius: 0;
        clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
        border: 1px solid var(--color-primary);
        box-shadow: 0 0 10px var(--futuristic-avatar-glow);
      }
      /* [COMPONENT:avatar:END] */

      /* [COMPONENT:tooltip:START] */
      .tooltip {
        position: absolute;
        z-index: 9999;
        padding: var(--tooltip-padding-y) var(--tooltip-padding-x);
        background: var(--tooltip-bg);
        color: var(--tooltip-color);
        font-size: var(--tooltip-font-size);
        border-radius: var(--tooltip-border-radius);
        box-shadow: var(--shadow-md);
        pointer-events: none;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .tooltip.show { opacity: 1; }
      .tooltip::after {
        content: '';
        position: absolute;
        border: 4px solid transparent;
      }
      .tooltip[data-placement="top"]::after {
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        border-top-color: var(--tooltip-bg);
      }
      .tooltip[data-placement="bottom"]::after {
        top: -8px;
        left: 50%;
        transform: translateX(-50%);
        border-bottom-color: var(--tooltip-bg);
      }
      
      .tooltip.retro {
        border-radius: 0;
        border: var(--retro-border-width) solid var(--text-default);
        box-shadow: 2px 2px 0 var(--retro-shadow-color);
      }
      
      .tooltip.modern {
        backdrop-filter: blur(10px);
        background: color-mix(in srgb, var(--tooltip-bg) 90%, transparent);
      }
      
      .tooltip.futuristic {
        border-radius: 0;
        border: 1px solid var(--color-primary);
        background: color-mix(in srgb, var(--tooltip-bg) 80%, transparent);
        box-shadow: 0 0 10px var(--futuristic-tooltip-glow);
        backdrop-filter: blur(5px);
      }
      /* [COMPONENT:tooltip:END] */

      /* [COMPONENT:popover:START] */
      .popover {
        position: absolute;
        z-index: 9999;
        background: var(--popover-bg);
        color: var(--popover-color);
        border: 1px solid var(--popover-border-color);
        border-radius: var(--popover-border-radius);
        padding: var(--popover-padding);
        box-shadow: var(--shadow-lg);
        min-width: 200px;
        max-width: 300px;
      }
      .popover-header {
        font-weight: 600;
        margin-bottom: 0.5rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-default);
      }
      
      .popover.retro {
        border-radius: 0;
        border: var(--retro-border-width) solid var(--text-default);
        box-shadow: 4px 4px 0 var(--retro-shadow-color);
      }
      
      .popover.modern {
        backdrop-filter: blur(20px);
        background: color-mix(in srgb, var(--popover-bg) 95%, transparent);
        box-shadow: var(--shadow-xl);
      }
      
      .popover.futuristic {
        border-radius: 0;
        clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        border: 1px solid var(--color-primary);
        background: color-mix(in srgb, var(--popover-bg) 90%, transparent);
        backdrop-filter: blur(10px);
        box-shadow: 0 0 20px var(--futuristic-popover-glow);
      }
      /* [COMPONENT:popover:END] */

      /* [COMPONENT:skeleton:START] */
      .skeleton {
        display: block;
        background: var(--skeleton-bg);
        border-radius: var(--skeleton-border-radius);
        position: relative;
        overflow: hidden;
        opacity: 0.7;
      }
      .skeleton::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, var(--skeleton-shimmer-color), transparent);
        animation: skeleton-shimmer 1.5s infinite;
      }
      @keyframes skeleton-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      
      .skeleton.retro {
        border-radius: 0;
        background: repeating-linear-gradient(
          45deg,
          var(--skeleton-bg),
          var(--skeleton-bg) 10px,
          color-mix(in srgb, var(--skeleton-bg) 80%, transparent) 10px,
          color-mix(in srgb, var(--skeleton-bg) 80%, transparent) 20px
        );
      }
      .skeleton.retro::after { display: none; }
      
      .skeleton.modern {
        background: linear-gradient(90deg, var(--skeleton-bg) 0%, color-mix(in srgb, var(--skeleton-bg) 90%, white) 50%, var(--skeleton-bg) 100%);
        background-size: 200% 100%;
        animation: skeleton-modern 1.5s infinite;
      }
      .skeleton.modern::after { display: none; }
      @keyframes skeleton-modern {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      
      .skeleton.futuristic {
        border-radius: 0;
        background: color-mix(in srgb, var(--color-primary) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--color-primary) 30%, transparent);
      }
      .skeleton.futuristic::after {
        background: linear-gradient(90deg, transparent, var(--color-primary), transparent);
        opacity: 0.3;
      }
      /* [COMPONENT:skeleton:END] */

      /* [COMPONENT:toast:START] */
      .toast-container {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        pointer-events: none;
      }
      .toast {
        background: var(--toast-bg);
        color: var(--toast-color);
        padding: var(--toast-padding);
        border-radius: var(--toast-border-radius);
        border: 1px solid var(--toast-border-color);
        box-shadow: var(--shadow-lg);
        min-width: 300px;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        pointer-events: auto;
        animation: toast-slide-in 0.3s ease-out;
      }
      @keyframes toast-slide-in {
        from { transform: translateX(400px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      
      .toast.retro {
        border-radius: 0;
        border: var(--retro-border-width) solid var(--text-default);
        box-shadow: 4px 4px 0 var(--retro-shadow-color);
      }
      
      .toast.modern {
        backdrop-filter: blur(20px);
        background: color-mix(in srgb, var(--toast-bg) 95%, transparent);
      }
      
      .toast.futuristic {
        border-radius: 0;
        border: 1px solid var(--color-primary);
        background: color-mix(in srgb, var(--toast-bg) 90%, transparent);
        backdrop-filter: blur(10px);
        box-shadow: 0 0 20px var(--futuristic-toast-glow);
      }
      /* [COMPONENT:toast:END] */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="toast-viewport" class="toast-container"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
